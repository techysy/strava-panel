<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strava Panel — 骑行统计</title>
<style>
:root{
  --bg:#0f1420; --card:#1a2130; --card2:#202a3d; --text:#e8edf5; --muted:#8a97ab;
  --brand:#fc4c02; --brand2:#e84300; --accent:#38bdf8; --good:#22c55e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:20px}
h1{font-size:22px;font-weight:700}
.badge{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--card2);color:var(--muted)}
.badge.ok{background:rgba(34,197,94,.15);color:var(--good)}
.badge.warn{background:rgba(252,76,2,.15);color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:18px}
.card .label{font-size:12px;color:var(--muted);margin-bottom:6px}
.card .value{font-size:28px;font-weight:800}
.card .unit{font-size:14px;color:var(--muted);font-weight:500;margin-left:2px}
.panel{background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:18px;margin-bottom:24px}
.panel h2{font-size:15px;margin-bottom:14px;color:var(--text)}
.setup{background:var(--card);border:1px solid rgba(252,76,2,.3);border-radius:14px;padding:20px;margin-bottom:24px;display:none}
.setup.show{display:block}
.setup h2{font-size:16px;color:var(--brand);margin-bottom:10px}
.setup label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.setup input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:var(--card2);color:var(--text);font-size:14px}
.btn{margin-top:16px;padding:10px 18px;border:none;border-radius:8px;background:var(--brand);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{background:var(--card2);color:var(--text);margin-left:8px}
.msg{font-size:13px;margin-top:10px;color:var(--accent);min-height:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
th{color:var(--muted);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:none}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:4px}
.bar>div{height:100%;background:var(--brand);border-radius:3px}
.tips{font-size:12px;color:var(--muted);line-height:1.7;background:var(--card2);padding:12px 16px;border-radius:10px}
a{color:var(--accent)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--card2);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-left:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">S</div>
    <h1>Strava 骑行面板</h1>
    <span class="badge" id="statusBadge">检测中…</span>
  </header>

  <div class="setup" id="setup">
    <h2>⚙️ 配置 Strava 凭据</h2>
    <p class="tips" style="margin-bottom:8px">
      在 <a href="https://www.strava.com/settings/api" target="_blank">Strava My API Application</a> 查看 Client ID / Client Secret。
      Refresh Token 需通过 OAuth 授权获取。
    </p>
    <label>Client ID</label><input id="client_id" placeholder="你的 Client ID">
    <label>Client Secret</label><input id="client_secret" placeholder="你的 Client Secret">
    <label>Refresh Token</label><input id="refresh_token" placeholder="你的 Refresh Token">
    <div class="msg" id="setupMsg"></div>
    <button class="btn" id="saveBtn" onclick="saveConfig()">保存并验证</button>
    <button class="btn secondary" onclick="refreshStatus()">重新检测</button>
  </div>

  <div class="grid" id="statsGrid" style="display:none">
    <div class="card"><div class="label">骑行次数</div><div class="value"><span id="cRides">-</span><span class="unit">次</span></div></div>
    <div class="card"><div class="label">总距离</div><div class="value"><span id="cDist">-</span><span class="unit">km</span></div></div>
    <div class="card"><div class="label">总时长</div><div class="value"><span id="cDur">-</span><span class="unit">h</span></div></div>
    <div class="card"><div class="label">总爬升</div><div class="value"><span id="cElev">-</span><span class="unit">m</span></div></div>
  </div>

  <div class="panel" id="weeklyPanel" style="display:none">
    <h2>📊 每周骑行距离 (km)</h2>
    <div id="weeklyChart"></div>
  </div>

  <div class="panel" id="recentPanel" style="display:none">
    <h2>🚴 最近骑行</h2>
    <table id="recentTable"><thead><tr><th>日期</th><th>活动</th><th>距离</th><th>时长</th><th>爬升</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="panel">
    <h2>🔄 Token 自动刷新</h2>
    <p class="tips">Strava access token 约 6 小时过期。本应用每次访问 API 时自动用 refresh_token 刷新，无需手动干预。凭据保存在 NAS 应用数据目录。</p>
  </div>
</div>

<script>
const API = "";
let cfg = {};

async function refreshStatus(){
  const badge = document.getElementById("statusBadge");
  badge.className = "badge"; badge.innerHTML = "检测中…<span class='spinner'></span>";
  try{
    const r = await fetch(API + "/api/status");
    const s = await r.json();
    if(s.configured && s.has_token){
      badge.className = "badge ok"; badge.textContent = "已连接 ✓";
      document.getElementById("setup").classList.remove("show");
      loadData();
    } else {
      badge.className = "badge warn"; badge.textContent = "未配置凭据";
      document.getElementById("setup").classList.add("show");
      document.getElementById("statsGrid").style.display = "none";
      document.getElementById("weeklyPanel").style.display = "none";
      document.getElementById("recentPanel").style.display = "none";
    }
  }catch(e){ badge.className="badge warn"; badge.textContent="连接失败"; }
}

async function loadData(){
  document.getElementById("statsGrid").style.display = "grid";
  try{
    const r = await fetch(API + "/api/stats");
    const s = await r.json();
    if(s.error){ showError(s.error); return; }
    document.getElementById("cRides").textContent = s.total_rides;
    document.getElementById("cDist").textContent = s.total_distance_km;
    document.getElementById("cDur").textContent = s.total_duration_h;
    document.getElementById("cElev").textContent = s.total_elevation_m;
    renderWeekly(s.weekly||[]);
    document.getElementById("weeklyPanel").style.display = "block";
  }catch(e){ showError(e.message); }

  try{
    const r = await fetch(API + "/api/activities");
    const d = await r.json();
    if(d.activities){
      const rides = d.activities.filter(a=>a.type==="Ride").slice(0,10);
      const tbody = document.getElementById("recentTable").querySelector("tbody");
      tbody.innerHTML = rides.map(a=>{
        const date = (a.start_date||"").slice(0,10);
        const km = ((a.distance||0)/1000).toFixed(1);
        const h = ((a.moving_time||0)/3600).toFixed(1);
        const el = Math.round(a.total_elevation_gain||0);
        return `<tr><td>${date}</td><td>${escapeHtml(a.name||"")}</td><td>${km} km</td><td>${h} h</td><td>${el} m</td></tr>`;
      }).join("");
      document.getElementById("recentPanel").style.display = "block";
    }
  }catch(e){}
}

function renderWeekly(weeks){
  const max = Math.max(...weeks.map(w=>w.dist_km), 1);
  document.getElementById("weeklyChart").innerHTML =
    weeks.slice(-8).map(w=>{
      const pct = (w.dist_km/max*100).toFixed(1);
      return `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted)">
          <span>${w.week}</span><span>${w.dist_km.toFixed(1)} km · ${w.count}次</span>
        </div>
        <div class="bar"><div style="width:${pct}%"></div></div>
      </div>`;
    }).join("") || "暂无数据";
}

async function saveConfig(){
  const btn = document.getElementById("saveBtn");
  btn.disabled = true; btn.innerHTML = "保存中…";
  const msg = document.getElementById("setupMsg");
  try{
    const r = await fetch(API + "/api/config", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        client_id: document.getElementById("client_id").value,
        client_secret: document.getElementById("client_secret").value,
        refresh_token: document.getElementById("refresh_token").value,
      })
    });
    const d = await r.json();
    if(d.ok){ msg.textContent = "✓ 凭据有效，已连接！"; setTimeout(refreshStatus, 800); }
    else msg.textContent = "✗ " + (d.error||"验证失败");
  }catch(e){ msg.textContent = "✗ " + e.message; }
  btn.disabled = false; btn.innerHTML = "保存并验证";
}

async function loadConfig(){
  try{
    const r = await fetch(API + "/api/config");
    const c = await r.json();
    document.getElementById("client_id").value = c.client_id || "";
    if(c.client_secret) document.getElementById("client_secret").value = "••••••••";
  }catch(e){}
}

function showError(m){ console.error(m); }
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

refreshStatus();
</script>
</body>
</html>
