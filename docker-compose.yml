services:
  strava-panel:
    build: .
    image: techysy/strava-panel:latest
    container_name: strava-panel
    restart: unless-stopped
    ports:
      - "20227:20227"          # 左边可改成宿主机其他端口,如 "8080:20227"
    volumes:
      - strava-data:/data      # 凭据/token/SQLite 全部持久化在这里
    # 环境变量(默认已内置,一般无需改):
    # environment:
    #   SP_PORT: "20227"
    #   SP_HOST: "0.0.0.0"
    #   SP_DATA_DIR: "/data"

volumes:
  strava-data:
