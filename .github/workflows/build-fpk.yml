name: Build Strava Panel fpk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-fpk:
    strategy:
      matrix:
        # url = 桌面图标在浏览器新标签页打开(网页版);iframe = 在飞牛桌面窗口里打开(窗口版)。
        # 两者 appname 相同、共用数据目录,覆盖安装即可互相切换
        variant: [url, iframe]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 构建身份:打进 app 根(包内 server/ 的上一级,对应 server 读取的仓库根 build.json)
      - name: Generate build.json
        run: python scripts/gen-build-info.py --channel fpk

      # 拷贝打包工程到构建目录,manifest / ui config 只在副本上改,不碰 tracked 文件
      - name: Stage build dir (server + www + build.json)
        run: |
          set -euo pipefail
          rm -rf build-fpk
          cp -r fnos-packaging build-fpk
          rm -rf build-fpk/app/server build-fpk/app/www
          mkdir -p build-fpk/app/server build-fpk/app/www
          cp -r server/. build-fpk/app/server/
          cp -r www/. build-fpk/app/www/
          cp build.json build-fpk/app/build.json
          # 防御性清理:Python 后端已重构为 Node.js,历史残留 *.py/__pycache__ 一律剔除
          find build-fpk/app -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          find build-fpk/app -name '*.py' -type f -delete 2>/dev/null || true
          ls -la build-fpk/app/ build-fpk/app/server/ build-fpk/app/www/

      - name: Download fnpack
        env:
          FNPACK_VERSION: "1.2.1"
          FNPACK_BIN: "fnpack-1.2.1-linux-amd64"
          FNPACK_SHA256: "72d2a4095da676b64510b023731a227b369d80f8079bc45ff8a2f802ec0480c1"
        run: |
          curl -fsSL -o /usr/local/bin/fnpack "https://static2.fnnas.com/fnpack/${FNPACK_BIN}"
          echo "${FNPACK_SHA256}  /usr/local/bin/fnpack" | sha256sum -c -
          chmod +x /usr/local/bin/fnpack
          fnpack --help | head -3

      - name: Select desktop entry (url / iframe)
        working-directory: build-fpk
        run: |
          set -euo pipefail
          if [ "${{ matrix.variant }}" = "iframe" ]; then
            WANT=iframe
          else
            WANT=url
          fi
          OTHER=$([ "$WANT" = "iframe" ] && echo url || echo iframe)
          sed -i "s/\"type\": \"${OTHER}\"/\"type\": \"${WANT}\"/" app/ui/config
          if [ "$WANT" = "iframe" ]; then
            sed -i -E 's/^(desc[[:space:]]*=[[:space:]]*)(.*)$/\1\2 · 窗口版(在飞牛桌面窗口里打开)/' manifest
          fi
          cat app/ui/config
          grep -E '^desc[[:space:]]*=' manifest

      - name: Build fpk
        run: |
          set -euo pipefail
          cd build-fpk
          rm -f strava.fpk
          fnpack build -d .
          [ -f strava.fpk ] || { echo "ERROR: fnpack build failed"; exit 1; }
          VERSION="$(grep -E '^version[[:space:]]*=' manifest | head -1 | sed 's/.*=//;s/[[:space:]]//g')"
          [ -n "$VERSION" ] || { echo "ERROR: could not extract version from manifest"; exit 1; }
          SUFFIX=""
          if [ "${{ matrix.variant }}" = "iframe" ]; then SUFFIX="-iframe"; fi
          OUT="strava-fnos-${VERSION}${SUFFIX}.fpk"
          mv strava.fpk "${OUT}"
          sha256sum "${OUT}"
          ls -lh "${OUT}"

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: strava-fpk-${{ matrix.variant }}-${{ github.sha }}
          path: build-fpk/strava-*.fpk
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build-fpk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download fpk artifacts
        uses: actions/download-artifact@v4
        with:
          path: fpk-assets
          pattern: strava-fpk-*
          merge-multiple: true

      - name: Ensure release exists
        run: |
          gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
              --title "Strava Panel ${{ github.ref_name }}" \
              --notes "Strava Panel fpk release(网页版/窗口版)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate checksum
        run: |
          set -euo pipefail
          ( cd fpk-assets && sha256sum strava-*.fpk > SHA256SUMS-fpk.txt )
          cat fpk-assets/SHA256SUMS-fpk.txt

      - name: Upload to Release
        run: |
          set -euo pipefail
          ls -lh fpk-assets/
          N=$(ls fpk-assets/strava-*.fpk 2>/dev/null | wc -l)
          [ "$N" -ge 2 ] || { echo "ERROR: expected 2 fpk (url + iframe), found $N"; exit 1; }
          gh release upload "${{ github.ref_name }}" \
            fpk-assets/strava-*.fpk \
            fpk-assets/SHA256SUMS-fpk.txt \
            --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          echo "## ✅ Strava Panel fpk 构建完成(网页版 + 窗口版 双产物)" >> "$GITHUB_STEP_SUMMARY"
          ls -lh fpk-assets/ >> "$GITHUB_STEP_SUMMARY"
