name: Build Strava Panel CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 汇集 server + www 到 cli/app,再 npm pack(纯 JS + Python 源码,无需安装依赖)
      - name: Build and pack
        working-directory: cli
        run: |
          set -euo pipefail
          npm run build
          npm pack --pack-destination .
          ls -lh *.tgz

      - name: Upload artifact (non-tag)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: strava-cli-${{ github.sha }}
          path: cli/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cli/*.tgz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "## ✅ CLI 包已发布" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "npm i -g @techysy/strava-panel   # 或从 Release 下载 tgz" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
