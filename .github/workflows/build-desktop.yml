name: Build Strava Panel Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-desktop:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # build.ps1 四步一条龙:Embeddable Python 运行时 → 汇集 server+www → npm install → electron-builder
      - name: Build NSIS + Portable
        working-directory: desktop
        shell: pwsh
        run: ./build.ps1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifact (non-tag)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: strava-desktop-${{ github.sha }}
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          "## ✅ Desktop 安装包已发布" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-ChildItem desktop\dist\*.exe | ForEach-Object { "- $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" } | Out-File -Append $env:GITHUB_STEP_SUMMARY
